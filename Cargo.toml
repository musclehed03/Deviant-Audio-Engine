[package]
name = "deviant-audio-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
description = "Standalone native decoding and Windows exclusive audio output"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ogg = "0.9"
opus-decoder = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "ogg", "pcm", "wav"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.22"

[profile.release]
panic = "unwind"
